name: build-and-deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "helm/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CLUSTER: cloud-native-platform-dev
  ECR_REPO: cloud-native-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:  arn:aws:iam::673586358557:role/github-actions-cloud-native
          aws-region: ${{ env.AWS_REGION }}

      - name: Debug OIDC subject
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | python3 -c "
          import sys, json, base64
          t = json.load(sys.stdin)['value'].split('.')[1]
          t += '=' * (-len(t) % 4)
          c = json.loads(base64.urlsafe_b64decode(t))
          print('sub =', c['sub']); print('aud =', c['aud'])
          "

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:$TAG
          docker build --provenance=false -t $IMAGE app/
          docker push $IMAGE
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Lint chart
        run: helm lint helm/api

      - name: Deploy
        run: |
          aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
          helm upgrade --install api ./helm/api -n app --create-namespace \
            --set image.tag=$TAG --wait --timeout 3m

      - name: Smoke test
        run: |
          kubectl get pods -n app
          kubectl rollout status deploy/api -n app --timeout=60s